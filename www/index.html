<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>贪吃蛇</h1>
      <div class="scores">
        <div class="score-card">
          <span class="label">分数</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="score-card">
          <span class="label">最高分</span>
          <span class="value" id="high-score">0</span>
        </div>
      </div>
    </header>

    <section class="board-wrap">
      <canvas id="game" width="400" height="400" aria-label="贪吃蛇游戏区域"></canvas>
      <div class="tilt-hud hidden" id="tilt-hud">
        <div class="bubble-level" id="bubble-level" aria-label="倾斜指示器">
          <span class="level-cross" aria-hidden="true"></span>
          <span class="bubble" id="bubble"></span>
        </div>
        <button type="button" class="btn calibrate" id="btn-calibrate">校准</button>
      </div>
      <div class="overlay" id="overlay">
        <div class="overlay-card" id="overlay-card">
          <p class="overlay-title" id="overlay-title">贪吃蛇</p>
          <p class="overlay-text" id="overlay-text">吃掉果实，避开墙壁和自己。</p>
          <p class="overlay-score hidden" id="overlay-score"></p>
        </div>
      </div>
    </section>

    <div class="mode-switch" id="mode-switch" role="tablist" aria-label="游戏模式">
      <button type="button" class="mode-btn active" id="mode-classic" data-mode="classic" aria-pressed="true">经典模式</button>
      <button type="button" class="mode-btn" id="mode-gravity" data-mode="gravity" aria-pressed="false">重力模式</button>
    </div>

    <div class="controls">
      <button type="button" class="btn primary" id="btn-start">开始</button>
      <button type="button" class="btn" id="btn-pause" disabled>暂停</button>
      <button type="button" class="btn" id="btn-restart">重新开始</button>
    </div>

    <p class="hint" id="hint">方向键或 WASD 移动，空格暂停</p>
    <p class="fallback-hint hidden" id="fallback-hint">未检测到倾斜感应，可用方向键或屏幕方向键控制。果实会顺着你最近选择的方向滚动。</p>

    <nav class="dpad" aria-label="触屏方向键">
      <button type="button" class="dpad-btn" data-dir="up" aria-label="上">▲</button>
      <button type="button" class="dpad-btn" data-dir="left" aria-label="左">◀</button>
      <button type="button" class="dpad-btn dpad-center" disabled aria-hidden="true"></button>
      <button type="button" class="dpad-btn" data-dir="right" aria-label="右">▶</button>
      <button type="button" class="dpad-btn" data-dir="down" aria-label="下">▼</button>
    </nav>
  </main>

  <script src="game.js"></script>
</body>
</html>
